<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.3" flood-color="#0f172a" />
    </filter>
  </defs>

  <!-- 角丸アプリアイコン背景 -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- 領収書用紙 (レシート形状) -->
  <g filter="url(#shadow)">
    <!-- レシート本体 -->
    <path d="M140 100 
             H372 
             V390 
             L350 375 L328 390 L306 375 L284 390 L262 375 L240 390 L218 375 L196 390 L174 375 L152 390 L140 382 Z" 
          fill="url(#paperGrad)" />

    <!-- レシートのヘッダー・バー -->
    <rect x="180" y="140" width="152" height="14" rx="7" fill="#cbd5e1" />
    
    <!-- 領収書テキストライン -->
    <rect x="170" y="180" width="172" height="10" rx="5" fill="#94a3b8" />
    <rect x="170" y="206" width="110" height="10" rx="5" fill="#cbd5e1" />
    <rect x="170" y="232" width="140" height="10" rx="5" fill="#cbd5e1" />

    <!-- 金額ライン -->
    <line x1="170" y1="265" x2="342" y2="265" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,4" />
    <rect x="220" y="285" width="122" height="16" rx="6" fill="#059669" />

    <!-- カメラ / スキャンアイコン -->
    <circle cx="210" cy="340" r="18" fill="#2563eb" />
    <circle cx="210" cy="340" r="8" fill="#ffffff" />
  </g>

  <!-- PDFバッジ -->
  <rect x="270" y="322" width="90" height="38" rx="8" fill="#dc2626" />
  <text x="315" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">PDF</text>
</svg>
